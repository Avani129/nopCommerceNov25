
name: Build NopCommerce

on:
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ✅ FIX: install dotnet to a user-writable folder (no /usr/share/dotnet)
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'   # or '8.0.x' for LTS
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet

      - name: Add dotnet to PATH
        run: |
          echo "${{ runner.temp }}/dotnet" >> $GITHUB_PATH
          echo "DOTNET_ROOT=${{ runner.temp }}/dotnet" >> $GITHUB_ENV

      - name: Build & Publish
        run: |
          rm -rf published published.zip || true

          dotnet --info
          dotnet restore src/Presentation/Nop.Web/Nop.Web.csproj
          dotnet build -c Release src/Presentation/Nop.Web/Nop.Web.csproj
          dotnet publish -c Release -o published src/Presentation/Nop.Web/Nop.Web.csproj

          sudo apt-get update -y
          sudo apt-get install -y zip

          cd published
          zip -r ../published.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: published
          path: published.zip
